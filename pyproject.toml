[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Local paper-trading research system"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "requests>=2.31",
    "diskcache>=5.6",
    "pydantic>=2.5",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.optional-dependencies]
timesfm = [
    "timesfm>=1.0",
    "jax>=0.4",
    "jaxlib>=0.4",
]
dev = [
    "black",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "schemas*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: marks tests as requiring a live API key (deselect with '-m not live')",
]
