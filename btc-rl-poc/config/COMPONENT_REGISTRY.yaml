# COMPONENT_REGISTRY.yaml v1.0.0 — 2026-08-30
# Machine-readable migration manifest (PM plan §85). One row per
# component; `runtime: false` means the daemon/crons do no live work
# for it. History is NEVER deleted — see reopen_condition per row.
# Enforced by tests/invariants.py (retired-roster-frozen,
# one-control-one-treatment) and consumed by emitters/agents/UI.

version: 1.2.0
# PLANES (PM 09-08) — WHAT responsibility a component carries, an
# axis orthogonal to `tier` (WHERE in the lifecycle). Full map:
# docs/ARCHITECTURE_TIERS_PLANES.md. The Teaching plane (F) observes
# and explains but must NEVER mutate canonical research state.
planes:
  A: DATA                # what happened
  B: MODEL               # what we believe
  C: DECISION_EXECUTION  # what we do
  D: RESEARCH            # what we are testing
  E: RELIABILITY_GOVERNANCE  # whether we can trust any of it
  F: TEACHING            # how we understand/explain it
budgets:
  max_active_traders: 5          # one slot deliberately EMPTY
  max_serving_model_roles: 3     # ROLES, not physical artifacts —
                                 # an ensemble/control may depend on
                                 # several frozen internals (PM 08-30)
  max_live_treatments_per_experiment: 1

# GOVERNANCE RULE (PM 08-30, from the M3 leader-pool discovery):
# "Runtime reachability beats registry intention." Before retiring
# anything, compute its dependency path to a live decision and assign
# a dependency_class:
#   ZERO_DECISION_IMPACT      -> may retire without registration
#   CONTROL_DEPENDENCY        -> retiring = NEW champion registration
#   TREATMENT_DEPENDENCY      -> retiring = experiment change
#   EXPERIMENT_DEPENDENCY     -> promotion/retirement via its experiment
#   OBSERVABILITY_DEPENDENCY  -> audit/safety consumer exists
#
# Model-role accounting (three roles, not three artifacts):
#   ROLE 1  MARKET/STRUCTURAL CONTROL
#   ROLE 2  CHAMPION POLICY MODEL SYSTEM (frozen internal leader
#           pool: kb3, kb4, kb7, kb8 + inputs kb, kb2)
#   ROLE 3  CHALLENGER (kb9)
# kb5 is an EXPERIMENT dependency of M14-v2, not a fourth role.
# Champion simplification (CHAMPION-vLean) is a FUTURE registered
# question — never a cleanup action.

