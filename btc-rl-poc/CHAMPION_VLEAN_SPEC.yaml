# CHAMPION-vLean — registered experiment to LEAN the champion's
# leader pool (PM 2026-09-07 cleanup). STATUS: SPEC_ONLY.
#
# WHY THIS EXISTS AS AN EXPERIMENT, NOT A CLEANUP:
# The PM's lean directive retires kb9/kb3/kb5/kb7/kb8 from T2
# probability-production contention (offline fail / no incremental
# market-relative value). But btc_rl/online.py line 529 shows
#   PT_ARMS = (kb2, kb3, kb4, kb7, kb8, kb9)
# — these arms are members of the FROZEN champion's leader pool, the
# T3 decision CONTROL. Removing any from runtime changes the
# champion's behavior and breaks its byte-equivalence (model-parity
# invariant, a SEV-0-class integrity risk). "Runtime reachability
# beats registry intention": a load-bearing arm is retired by a
# REGISTERED champion change, never by a cleanup edit.
version: 0.1-spec
experiment_id: CHAMPION-vLean
status: SPEC_ONLY
tier: T3-decision
control: CHAMPION-vCurrent (frozen leader pool kb2,kb3,kb4,kb7,kb8,kb9)
treatment: CHAMPION-vLean (leader pool reduced to the arms with
  demonstrated market-relative value — candidate set kb2, kb4 only;
  drop kb3, kb5(n/a), kb7, kb8, kb9)
hypothesis: >
  A leaner leader pool produces a champion whose decisions are at
  least as good (paired, after costs) as the current pool — i.e.
  the dropped arms contribute no decision value, only complexity.
primary_metric: paired champion decision PnL per eligible window
  (vCurrent vs vLean), same windows both arms
decision_rule: standard registered gates + seeded-bootstrap CI;
  QUALIFY only if vLean is non-inferior (CI lower bound within a
  pre-registered margin) AND simpler
guardrails:
  - never mutate the frozen champion in place — vLean is a NEW
    registered arm run in shadow first
  - model-parity invariant must stay green throughout (vCurrent
    byte-equivalent until vLean formally promotes)
blocked_on:
  - the downstream slot is currently held by t_exec_reg (one formal
    treatment per tier); CHAMPION-vLean waits its turn
retirement_intents_this_experiment_would_execute:
  - {arm: kb9, from: T2 challenger + champion pool,
     evidence: "OFFLINE_FAIL median BSS -0.021, 2/5 folds"}
  - {arm: kb3, from: champion pool, evidence: "no incremental
     market-relative value"}
  - {arm: kb7, from: champion pool, evidence: "worst fold -0.18"}
  - {arm: kb8, from: champion pool, evidence: "dominated"}
note: >
  Until this experiment runs and qualifies, kb3/kb7/kb8/kb9 REMAIN
  serving as champion-internal (runtime unchanged); they are marked
  RETIRED_FROM_T2_CONTENTION (no independent challenger traffic, not
  shown as probability contenders) but NOT removed from the pool.
  This is the conservative, integrity-preserving choice.
