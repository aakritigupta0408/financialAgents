<!-- HOME — renders results/home_snapshot.json on the shared theme.css. Presentation
     only (formatting + SVG plotting of precomputed series); no canonical science in
     JS. Guarded by tests/test_no_frontend_science.py. -->
<link rel="stylesheet" href="theme.css">
<style>
  main{gap:26px}
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:34px 36px}
  .hero .eyebrow{margin-bottom:14px}
  .hero h1{font-size:2rem;line-height:1.12;max-width:20ch}
  .hero .tk{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:24px 34px;margin:28px 0 6px}
  .fact .k{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .fact .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:5px}
  .fact .v.up{color:var(--up)} .fact .v.down{color:var(--down)}
  .badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;padding:6px 15px;
    border-radius:999px;border:1px solid var(--border);color:var(--ink-2)}
  .badge.locked{color:var(--series-2);border-color:rgba(36,97,184,.4);background:rgba(36,97,184,.07)}
  .probs{margin-top:30px;display:grid;gap:18px;max-width:560px}
  .pr .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .pr .nm{font-size:14px;color:var(--ink-2)} .pr .nm b{color:var(--ink);font-weight:600}
  .pr .pv{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
  .pr .bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
  .pr .fill{height:100%;border-radius:999px;transition:width .5s ease}
  .pr.oracle .pv{color:var(--series-2)}
  .relate{margin-top:16px;font-size:13.5px;color:var(--muted);line-height:1.6;max-width:60ch}
  .relate b{color:var(--ink-2);font-weight:600}
  .chart{margin-top:30px;border-top:1px solid var(--border);padding-top:22px}
  .chart .cl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:6px}
  .emptychart{color:var(--muted);padding:24px 0;font-size:13.5px}
  .sec-head{margin-bottom:16px}
  .fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
  .tc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;
    display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
  .tc:hover{box-shadow:0 12px 34px rgba(22,32,44,.09);transform:translateY(-2px)}
  .tc.shadow{background:var(--surface-2)}
  .tc .chip{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:4px 11px;border-radius:7px;margin-bottom:15px}
  .tc .nm{font:500 22px/1.05 var(--display);color:var(--ink)}
  .tc .blurb{font-size:12.5px;color:var(--muted);line-height:1.55;margin:7px 0 0;min-height:56px}
  .tc .metric{margin-top:4px}
  .tc .big{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1}
  .tc .big.pos{color:var(--up)} .tc .big.neg{color:var(--down)} .tc .big.mut{color:var(--ink-2);font-size:24px}
  .tc .unit{font-size:11px;color:var(--muted);margin-top:6px}
  .tc .evbar{height:6px;border-radius:999px;background:var(--surface);border:1px solid var(--border);
    overflow:hidden;margin:14px 0 4px}
  .tc.shadow .evbar{background:var(--surface)}
  .tc .evbar>i{display:block;height:100%;border-radius:999px;background:var(--up)}
  .tc .stats{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--muted)}
  .tc .stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .tc .reason{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:14px}
  .tc .foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--grid);font-size:12px}
  .tc .live{color:var(--muted);display:flex;align-items:center;gap:6px}
  .tc .vd{font-weight:600}
  .vd.good{color:var(--up)} .vd.mut{color:var(--muted)} .vd.warn{color:var(--series-4)}
  .waiting{text-align:center;padding:56px 20px}
  .waiting h2{font-family:var(--display);font-size:1.5rem;margin-bottom:8px}
  .waiting p{color:var(--muted);max-width:46ch;margin:0 auto}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  main>section{animation:fadein .45s ease both}
  @media (prefers-reduced-motion:reduce){main>section{animation:none} .pr .fill{transition:none}}
</style>
<div class="topnav">
  <a class="brand" href="home.html">BTC Oracle</a>
  <a class="nav here" href="home.html">Home</a>
  <a class="nav" href="oracle.html">Oracle</a>
  <a class="nav" href="experiments.html">Experiments</a>
  <span class="spacer"></span>
  <span class="tag">Paper Research</span>
</div>
<div class="research-banner" id="banner"><b>Paper / simulation.</b> Real money disabled. Research, not advice.</div>
<main id="app">
  <section class="waiting"><h2>Loading the desk…</h2><p>Fetching the current paper snapshot.</p></section>
</main>
<script>
const $=(s,e=document)=>e.querySelector(s);
const A=n=>n==null||n==="UNAVAILABLE"?null:n;
const usd=c=>c==null?"—":(c<0?"−$":"$")+Math.abs(c/100).toLocaleString(undefined,{maximumFractionDigits:0});
const pctN=(x,d=0)=>x==null?"—":(100*x).toFixed(d)+"%";
const dol=v=>v==null?"—":"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const ROLE={CONTROL:["var(--series-1)","rgba(102,114,131,.12)"],
  FORMAL_TREATMENT:["var(--series-7)","rgba(13,122,78,.12)"],
  SHADOW:["var(--series-4)","rgba(143,96,0,.12)"],
  NOT_QUALIFIED:["var(--faint)","var(--surface-2)"]};

function probBar(name,v,color,cls){
  const p=v==null?0:Math.max(0,Math.min(1,v));
  return `<div class="pr ${cls||''}"><div class="top"><span class="nm">${name}</span>
    <span class="pv" style="${cls?'':'color:var(--ink)'}">${v==null?"—":pctN(v)}</span></div>
    <div class="bar"><div class="fill" style="width:${(p*100).toFixed(1)}%;background:${color}"></div></div></div>`;
}
function trajChart(traj){
  if(!traj||traj.length<4) return `<div class="emptychart">Trajectory collects over the live window — no chart yet for this contract.</div>`;
  const W=920,H=190,pad=30;
  const xs=traj.map(p=>p.t_left_min), maxX=Math.max(...xs), minX=Math.min(...xs);
  const X=t=>pad+(1-(t-minX)/((maxX-minX)||1))*(W-2*pad);
  const Y=p=>pad+(1-p)*(H-2*pad);
  const line=traj.map((p,i)=>(i?"L":"M")+X(p.t_left_min).toFixed(1)+" "+Y(p.p_mech).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:190px">
    <line class="gridline" x1="${pad}" y1="${Y(.5)}" x2="${W-pad}" y2="${Y(.5)}" stroke-dasharray="3 5"></line>
    <text x="${pad}" y="${Y(.5)-6}">50%</text>
    <path d="${line}" fill="none" stroke="var(--series-2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
    <circle cx="${X(traj[traj.length-1].t_left_min)}" cy="${Y(traj[traj.length-1].p_mech)}" r="4.5" fill="var(--series-2)"></circle>
    <text x="${pad}" y="${H-8}">${maxX.toFixed(0)}m left</text>
    <text x="${W-pad}" y="${H-8}" text-anchor="end">now</text>
  </svg>`;
}
function hero(o){
  const brti=A(o.official_brti),tgt=A(o.official_target),dist=A(o.distance),tte=A(o.time_remaining_min);
  const pm=A(o.p_mech),po=A(o.p_oracle),pk=A(o.p_market);
  const st=(o.oracle_state||"SEARCHING"), distCls=dist==null?"":dist>=0?"up":"down";
  return `<section class="hero">
    <span class="eyebrow"><span class="live-dot"></span> BTC 15-minute contract · live</span>
    <h1>Will the close print above the open?</h1>
    <div class="tk">${o.contract||"KXBTC15M"}</div>
    <div class="facts">
      <div class="fact"><div class="k">BRTI now</div><div class="v">${dol(brti)}</div></div>
      <div class="fact"><div class="k">Target</div><div class="v">${dol(tgt)}</div></div>
      <div class="fact"><div class="k">Distance</div><div class="v ${distCls}">${dist==null?"—":(dist>=0?"+$":"−$")+Math.abs(dist).toFixed(0)}</div></div>
      <div class="fact"><div class="k">Time left</div><div class="v">${tte==null?"—":tte+"m"}</div></div>
      <div class="fact"><div class="k">Oracle</div><div class="v"><span class="badge ${st.includes("LOCK")?"locked":""}">${st}</span></div></div>
    </div>
    <div class="probs">
      ${probBar("Oracle — P(up)",po,"var(--series-2)","oracle")}
      ${probBar("Kalshi market — reference",pk,"var(--series-6)")}
    </div>
    <div class="relate">The Oracle is <b>mechanics ${pm==null?"—":pctN(pm)}</b> adjusted by independent information; Kalshi is the market's price, shown only as a reference — never an Oracle input.</div>
    <div class="chart">
      <div class="cl">Mechanical probability, this window</div>
      ${trajChart(o.trajectory)}
    </div>
  </section>`;
}
const VD={QUALIFIED_FOR_PROSPECTIVE:["Qualified","good"],INFORMATION_LIMITED:["Info-limited","mut"],
  SHADOW_ONLY:["Shadow","warn"],NOT_QUALIFIED:["Locked","mut"],REJECTED:["Rejected","mut"]};
function famCard(t){
  const [fg,bgc]=ROLE[t.role]||["var(--faint)","var(--surface-2)"];
  const bt=t.backtest||{};
  const isShadow=(t.role==="SHADOW"||t.role==="NOT_QUALIFIED");
  let metric,extra="";
  if(bt.ev_per_eligible_c!=null){
    const ev=bt.ev_per_eligible_c, w=Math.max(4,Math.min(100,ev/15*100));
    metric=`<div class="metric"><div class="big ${ev>=0?'pos':'neg'}">${ev>=0?'+':''}${ev.toFixed(1)}¢</div>
      <div class="unit">backtest EV per eligible window</div></div>
      <div class="evbar"><i style="width:${w}%"></i></div>
      <div class="stats"><span>Coverage <b>${pctN(bt.coverage)}</b></span>
        <span>Accuracy <b>${pctN(bt.accuracy,0)}</b></span>
        <span>Drawdown <b>${usd(bt.max_drawdown_c)}</b></span></div>`;
  } else if(bt.best_holdout_auc!=null){
    metric=`<div class="metric"><div class="big mut">AUC ${bt.best_holdout_auc}</div>
      <div class="unit">holdout · 0.50 = no signal</div></div>`;
  } else if(bt.leverage_only!=null){
    metric=`<div class="metric"><div class="big mut">Leverage only</div>
      <div class="unit">no risk-adjusted edge vs baselines</div></div>`;
  } else {
    metric=`<div class="metric"><div class="big mut">Locked</div>
      <div class="unit">awaiting component qualification</div></div>`;
  }
  const [vlab,vcls]=VD[t.verdict]||["—","mut"];
  return `<div class="tc ${isShadow?'shadow':''}">
    <span class="chip" style="color:${fg};background:${bgc}">${t.id} · ${t.role.replace(/_/g," ")}</span>
    <div class="nm">${t.name}</div>
    <div class="blurb">${t.blurb||""}</div>
    ${metric}
    <div class="reason">${t.reason||""}</div>
    <div class="foot">
      <span class="live"><span class="live-dot stale"></span> Live · n=${t.live?t.live.n:0}</span>
      <span class="vd ${vcls}">${vlab}</span>
    </div>
  </div>`;
}
function render(d){
  $("#app").innerHTML=hero(d.oracle_strip||{})
    +`<section><div class="sec-head"><span class="eyebrow">The trader family</span>
        <h2>One Oracle, five policies</h2>
        <p class="sub">Every policy consumes the same Oracle and differs only in how it acts. Backtest and live are shown separately — live collects once the exact-BRTI runtime is activated.</p></div>
        <div class="fam">${(d.trader_family||[]).map(famCard).join("")}</div></section>`;
  if(d.paper_banner){const p=d.paper_banner.split("—");$("#banner").innerHTML=`<b>${p[0].trim()}.</b> ${p.slice(1).join(" · ").replace(/\s+/g,' ').trim()}`;}
}
function waiting(){
  $("#app").innerHTML=`<section class="waiting"><span class="eyebrow" style="justify-content:center">
    <span class="live-dot stale"></span> BTC Oracle</span><h2>Waiting for the live desk</h2>
    <p>No current paper snapshot is available yet. The desk publishes a fresh snapshot each cycle — check back shortly.</p></section>`;
}
fetch("home_snapshot.json",{cache:"no-store"}).then(r=>r.ok?r.json():null)
  .then(d=>{ if(!d||!d.trader_family){waiting();return;} render(d); }).catch(()=>waiting());
</script>
