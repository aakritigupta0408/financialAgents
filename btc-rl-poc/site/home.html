<!-- HOME — renders results/home_snapshot.json VERBATIM using the shared site design
     system (theme.css). No scientific/economic formula runs here; only presentation
     (cents->$, %). Backend owners: btc_rl/economics.py + btc_rl/metrics.py.
     Enforced by tests/test_no_frontend_science.py. -->
<link rel="stylesheet" href="theme.css">
<style>
  /* page-specific layer built ON the shared tokens — no foreign palette */
  .hero{background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--border);border-radius:18px;padding:26px 28px;position:relative;overflow:hidden}
  .hero .eyebrow{margin-bottom:10px}
  .hero h1{font-size:2.1rem;line-height:1.05}
  .contract{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
    gap:18px 26px;margin-top:22px}
  .contract .stat .bignum{font-size:22px}
  .probband{margin-top:22px;display:grid;gap:10px}
  .prow{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:12px}
  .prow .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .track{height:9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
  .fill{height:100%;border-radius:999px}
  .prow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
  .fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;
    display:flex;flex-direction:column;gap:2px;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 6px 22px rgba(22,32,44,.08);transform:translateY(-1px)}
  .card .name{font:500 18px/1.2 var(--display);color:var(--ink);margin:6px 0 2px}
  .card .idn{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
  .card .rows{margin-top:10px;display:grid;gap:4px}
  .card .r{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
  .card .r b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .box{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
  .box .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .box .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .cmp{overflow-x:auto}
  .waiting{text-align:center;padding:46px 20px}
  .waiting h2{font-family:var(--display);font-size:1.4rem;margin-bottom:6px}
  .waiting p{color:var(--muted);max-width:44ch;margin:0 auto}
  .foot{color:var(--faint);font-size:12px;margin-top:6px}
</style>
<div class="topnav">
  <a class="brand" href="home.html">BTC Oracle</a>
  <a class="nav here" href="home.html">Home</a>
  <a class="nav" href="oracle.html">Oracle</a>
  <a class="nav" href="experiments.html">Experiments</a>
  <span class="spacer"></span>
  <span class="tag" id="paper">Paper Research</span>
</div>
<div class="research-banner" id="banner"><b>Paper / simulation.</b> Real money disabled. Research, not advice.</div>
<main id="app">
  <section class="waiting"><h2>Loading the desk…</h2><p>Fetching the current paper snapshot.</p></section>
</main>
<script>
const $=(s,e=document)=>e.querySelector(s);
const c2d=c=>c==null?"—":(c<0?"−$":"$")+Math.abs(c/100).toLocaleString(undefined,{maximumFractionDigits:0});
const pct=x=>x==null?"—":(100*x).toFixed(1)+"%";
const cls=v=>v==null?"":v>=0?"pos":"neg";
const ROLE={CONTROL:"var(--series-1)",FORMAL_TREATMENT:"var(--series-7)",SHADOW:"var(--series-4)",NOT_QUALIFIED:"var(--faint)"};

function probRow(lab,v,color){
  const p=(typeof v==="number")?Math.max(0,Math.min(1,v)):null;
  return `<div class="prow"><div class="lab">${lab}</div>
    <div class="track">${p!=null?`<div class="fill" style="width:${(p*100).toFixed(0)}%;background:${color}"></div>`:""}</div>
    <div class="val">${p!=null?(p*100).toFixed(0)+"%":"—"}</div></div>`;
}
function hero(o){
  const num=v=>v==null||v==="UNAVAILABLE"?"—":(typeof v==="number"?v.toLocaleString(undefined,{maximumFractionDigits:0}):v);
  const dollar=v=>v==null||v==="UNAVAILABLE"?"—":"$"+num(v);
  const dist=(typeof o.official_brti==="number"&&typeof o.official_target==="number")
    ?("$"+(o.official_brti-o.official_target).toFixed(0)):"—";
  return `<section class="hero">
    <span class="eyebrow"><span class="live-dot"></span> BTC Oracle · Independent Research Desk</span>
    <h1>${o.contract||"BTC 15M"} — is the close above the open?</h1>
    <div class="contract">
      <div class="stat"><div class="k">Official BRTI</div><div class="bignum">${dollar(o.official_brti)}</div></div>
      <div class="stat"><div class="k">Target</div><div class="bignum">${dollar(o.official_target)}</div></div>
      <div class="stat"><div class="k">Distance</div><div class="bignum">${dist}</div></div>
      <div class="stat"><div class="k">Oracle state</div><div class="bignum" style="font-size:18px">${o.oracle_state||"—"}</div></div>
      <div class="stat"><div class="k">Runtime truth</div><div class="bignum" style="font-size:13px;color:var(--muted)">${(o.runtime_contract_truth||"").replace(/_/g," ")}</div></div>
    </div>
    <div class="probband">
      ${probRow("MECH P(up)",o.p_mech,"var(--series-1)")}
      ${probRow("Oracle P(up)",o.p_oracle,"var(--series-2)")}
      ${probRow("Kalshi ref",o.p_market,"var(--series-6)")}
    </div>
    <div class="foot">Independent delta ${o.oracle_delta==null||o.oracle_delta==="UNAVAILABLE"?"—":o.oracle_delta}. Live p_mech/p_oracle populate once the runtime Oracle path is active.</div>
  </section>`;
}
function famCard(t){
  const bt=t.backtest||{};
  const btLine=bt.ev_per_eligible_c!=null?bt.ev_per_eligible_c.toFixed(1)+"¢ / eligible"
    :(bt.best_holdout_auc!=null?"holdout AUC "+bt.best_holdout_auc
    :(bt.t3_return_to_risk!=null?"return-to-risk "+bt.t3_return_to_risk:"—"));
  const live=t.live?(t.live.n>0?("n="+t.live.n):"COLLECTING"):"—";
  return `<div class="card" style="border-top:3px solid ${ROLE[t.role]||"var(--border)"}">
    <span class="arm-tag" style="align-self:flex-start;color:${ROLE[t.role]}">${t.id} · ${t.role.replace(/_/g," ")}</span>
    <div class="name">${t.name}</div>
    <div class="idn">${t.identity}</div>
    <div class="split">
      <div class="box"><div class="k">Backtest</div><div class="v">${btLine}</div></div>
      <div class="box"><div class="k">Live</div><div class="v">${live}</div></div>
    </div>
    <div class="rows">
      <div class="r"><span>Verdict</span><b>${(t.verdict||"—").replace(/_/g," ")}</b></div>
      ${t.holdout_effect?`<div class="r"><span>Holdout Δ</span><b>${t.holdout_effect.paired_delta_c}¢</b></div>`:""}
    </div>
  </div>`;
}
function trader(t){
  const o=t.online_summary||{};
  return `<div class="card">
    <span class="arm-tag control" style="align-self:flex-start">${t.role}</span>
    <div class="name">${t.name}</div>
    <div class="bignum ${cls(o.total_return)}" style="font-size:24px;margin:8px 0 0">${c2d(o.ending_capital_c)}</div>
    <div class="idn">from ${c2d(o.starting_capital_c)} · ${pct(o.total_return)} · ${t.strategy_type}</div>
    <div class="rows">
      <div class="r"><span>Realized P&L</span><b class="${cls(o.realized_pnl_c)}">${c2d(o.realized_pnl_c)}</b></div>
      <div class="r"><span>EV / eligible</span><b>${o.realized_ev_per_eligible_c==null?"—":o.realized_ev_per_eligible_c.toFixed(1)+"¢"}</b></div>
      <div class="r"><span>Coverage</span><b>${pct(o.coverage)}</b></div>
      <div class="r"><span>Win rate</span><b>${pct(o.win_rate)}</b></div>
      <div class="r"><span>Max drawdown</span><b>${c2d(o.max_drawdown_c)}</b></div>
    </div>
  </div>`;
}
function render(d){
  $("#paper").textContent="Paper Research";
  const app=$("#app");
  const fam=(d.trader_family||[]).map(famCard).join("");
  app.innerHTML=hero(d.oracle_strip||{})
    +`<section><span class="eyebrow">The trader family</span>
       <h2>One Oracle brain, five policies</h2>
       <p class="sub">Backtest and live evidence are shown separately and never blended. Learned traders run in shadow while T0/T1 are the frozen prospective experiment; live results collect once the exact-BRTI runtime is activated.</p>
       <div class="fam">${fam}</div></section>`;
  const wm=$("#banner"); if(d.paper_banner) wm.innerHTML=`<b>${d.paper_banner.split("—")[0]}</b> ${d.paper_banner.split("—").slice(1).join("—")}`;
}
function waiting(){
  $("#app").innerHTML=`<section class="waiting">
    <span class="eyebrow" style="justify-content:center"><span class="live-dot stale"></span> BTC Oracle</span>
    <h2>Waiting for the live desk</h2>
    <p>No current paper snapshot is available yet. The research desk publishes a fresh
       snapshot each cycle — check back shortly.</p></section>`;
}
fetch("home_snapshot.json",{cache:"no-store"})
  .then(r=>r.ok?r.json():null)
  .then(d=>{ if(!d||!d.traders){waiting();return;} render(d); })
  .catch(()=>waiting());
</script>
